<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>AI MRI Analysis Dashboard</title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >

    <link
        rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"
    >

    <style>

        *{
            margin:0;
            padding:0;
            box-sizing:border-box;
            font-family:'Segoe UI',sans-serif;
        }

        body{

            background:
            linear-gradient(
                rgba(2,6,23,0.95),
                rgba(2,6,23,0.97)
            ),

            url("/static/images/brain_bg.jpg");

            background-size:cover;
            background-position:center;

            min-height:100vh;

            color:white;

            overflow-x:hidden;
        }

        .sidebar{

            position:fixed;

            top:0;
            left:0;

            width:100px;
            height:100vh;

            background:rgba(15,23,42,0.8);

            backdrop-filter:blur(20px);

            border-right:1px solid rgba(255,255,255,0.08);

            transition:0.4s;

            z-index:1000;

            padding-top:25px;
        }

        .sidebar:hover{
            width:260px;
        }

        .sidebar ul{
            list-style:none;
            padding-left:20px;
        }

        .sidebar ul li{

            margin:35px 0;

            display:flex;
            align-items:center;

            cursor:pointer;
        }

        .sidebar ul li i{

            min-width:50px;

            font-size:24px;

            color:#38bdf8;
        }

        .sidebar ul li span{

            opacity:0;

            transition:0.4s;

            white-space:nowrap;

            font-size:18px;
        }

        .sidebar:hover ul li span{
            opacity:1;
        }

        .sidebar ul li:hover{
            color:#38bdf8;
        }


        .main{

            margin-left:110px;

            padding:40px;

            transition:0.4s;
        }

        .sidebar:hover ~ .main{
            margin-left:260px;
        }


        .hero{

            background:
            linear-gradient(
                rgba(15,23,42,0.92),
                rgba(15,23,42,0.92)
            );

            border:1px solid rgba(255,255,255,0.08);

            border-radius:30px;

            padding:50px;

            box-shadow:0 0 30px rgba(56,189,248,0.15);
        }

        .hero h1{

            font-size:55px;

            font-weight:700;

            margin-bottom:20px;
        }

        .hero p{

            color:#cbd5e1;

            font-size:20px;

            max-width:700px;

            line-height:1.7;
        }


        .status-row{

            margin-top:35px;
        }

        .status-card{

            background:rgba(15,23,42,0.92);

            border-radius:25px;

            padding:30px;

            border:1px solid rgba(255,255,255,0.08);

            transition:0.4s;

            height:100%;
        }

        .status-card:hover{

            transform:translateY(-8px);

            border-color:#38bdf8;

            box-shadow:0 0 20px rgba(56,189,248,0.2);
        }

        .status-icon{

            width:70px;
            height:70px;

            border-radius:20px;

            background:#020617;

            display:flex;
            align-items:center;
            justify-content:center;

            margin-bottom:20px;
        }

        .status-icon i{

            font-size:30px;

            color:#38bdf8;
        }

        .status-title{

            font-size:24px;

            font-weight:600;

            margin-bottom:10px;
        }

        .status-desc{

            color:#cbd5e1;

            line-height:1.7;
        }

        .analysis-panel{

            margin-top:40px;

            background:rgba(15,23,42,0.92);

            border-radius:30px;

            padding:40px;

            border:1px solid rgba(255,255,255,0.08);
        }

        .analysis-title{

            font-size:36px;

            font-weight:700;

            margin-bottom:15px;
        }

        .analysis-subtitle{

            color:#cbd5e1;

            margin-bottom:35px;

            font-size:18px;
        }

        .upload-box{

            border:2px dashed #38bdf8;

            border-radius:25px;

            padding:60px;

            text-align:center;

            background:#020617;

            transition:0.4s;
        }

        .upload-box:hover{

            border-color:#0ea5e9;

            box-shadow:0 0 25px rgba(56,189,248,0.15);
        }

        .upload-icon{

            font-size:70px;

            color:#38bdf8;

            margin-bottom:20px;
        }

        .upload-title{

            font-size:30px;

            font-weight:600;

            margin-bottom:10px;
        }

        .upload-desc{

            color:#cbd5e1;

            margin-bottom:30px;
        }

        .form-control{

            background:#0f172a !important;

            color:white !important;

            border:1px solid rgba(255,255,255,0.1);

            padding:14px;
        }

        .form-control::file-selector-button{

            background:#38bdf8;

            border:none;

            color:white;

            padding:10px 20px;

            border-radius:10px;

            margin-right:15px;
        }

        .btn-analyze{

            margin-top:30px;

            background:#38bdf8;

            border:none;

            color:white;

            padding:15px 40px;

            border-radius:15px;

            font-size:20px;

            transition:0.4s;
        }

        .btn-analyze:hover{

            background:#0ea5e9;

            transform:scale(1.05);
        }

        .footer{

            text-align:center;

            margin-top:40px;

            color:#94a3b8;
        }

    </style>

</head>

<body>

<div class="sidebar">

    <ul>

        <li>
            <i class="fa-solid fa-house"></i>
            <span>
                <a href="/" style="text-decoration:none;color:inherit;">
                    Dashboard
                </a>
            </span>
        </li>

        <li>
            <i class="fa-solid fa-brain"></i>
            <span>
                <a href="/analysis" style="text-decoration:none;color:inherit;">
                    MRI Analysis
                </a>
            </span>
        </li>

    </ul>

</div>

<div class="main">

    <div class="analysis-panel">

        <div class="analysis-title">
            Start MRI / X-Ray Analysis
        </div>

        <div class="analysis-subtitle">

            Upload a medical image to perform
            AI-powered tumor detection and
            multimodal medical reasoning.

        </div>

        <form
            action="/predict"
            method="POST"
            enctype="multipart/form-data"
        >

            <div class="upload-box">

                <div class="upload-icon">
                    <i class="fa-solid fa-cloud-arrow-up"></i>
                </div>

                <div class="upload-title">
                    Upload Medical Image
                </div>

                <div class="upload-desc">

                    Supported formats:
                    PNG, JPG, JPEG

                </div>

                <input
                    type="file"
                    name="file"
                    class="form-control"
                    required
                >

                <button
                    type="submit"
                    class="btn btn-analyze"
                >
                    Analyze with AI
                </button>

            </div>

        </form>

    </div>


    <div class="footer">

        AI Medical Imaging System © 2026

    </div>

</div>

</body>

</html>
